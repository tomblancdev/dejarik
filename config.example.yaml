# Dejarik — what an operator hands the panel. The real one is templated by
# whatever configuration manages it; this is the shape.
listen: ":8080"
# your own word, drawn into the mark. Leave it out and the panel
# ships its own name — it will never wear somebody else's house.
house: "Example House"
base_url: "https://dejarik.example.com"
timezone: "Europe/Paris"
data_dir: /data

auth:
  # identity is the proxy's job, and only from its address (the La Loge
  # contract). Anything else gets nothing.
  trusted_proxies: ["192.0.2.10/32"]
  admin_groups: [admins]
  player_groups: [players]
  # machines: `name:role:token` per line — a Home Assistant button, a script
  tokens_file: /etc/dejarik/tokens

veilleur:
  url: "http://192.0.2.20:8080"
  token_env: DEJARIK_VEILLEUR_TOKEN
  timeout: 5s

projects:
  # An APPLIANCE: a seat engine (Wolf) with a drawer per person. Identity is
  # the pairing — a device is pointed at a drawer and opens that person's
  # home, account and saves, running as their uid. No `target`: this one is
  # started by hand (the watchman does not know it yet), and the panel says
  # so instead of offering a button.
  appliance:
    label: "the appliance"
    wolf:
      # the door an unpaired Moonlight reads: no credential
      probe_url: "http://203.0.113.23:47989/serverinfo"
      # the engine's own API, reached through a bridge on one port. It
      # authenticates nobody: the firewall row to this port is the lock, and
      # this program uses named operations only (pair, point, list, seats,
      # stop) — never a general proxy.
      api_url: "http://203.0.113.23:47900"
      timeout: 3s
    # the drawers: keyed by the account name at the gateway; uid = what that
    # person's seats run as (unique — a live seat is joined to its drawer by
    # its uid). A `shared` drawer has no account behind it (a living-room
    # device everybody uses) and only an admin may point a device at it.
    people:
      someone: { uid: 3001, gid: 3000 }
      salon:   { label: "le salon", uid: 3100, gid: 3000, shared: true }
    connect:
      host: "appliance.example.com"
      tcp: [47984, 47989, 48010]
      udp: [48100, 48200, 47999]

  # A CONSOLE: one machine, one desktop, Sunshine; pairing relayed to its web
  # UI with the one account it has.
  console:
    label: "the console"
    target: console            # the Le Veilleur target this rides on
    wait_minutes: 10           # its min_uptime — how long it waits for you
    sunshine:
      # the door an unpaired Moonlight reads: no credential, so the second
      # truth survives a wrong or revoked password
      probe_url: "http://203.0.113.21:47989/serverinfo"
      # the web UI's API: pair, list, unpair. Named endpoints only.
      admin_url: "https://203.0.113.21:47990"
      basic_auth_env: DEJARIK_SUNSHINE_BASIC_CONSOLE
      timeout: 3s
    connect:
      host: "203.0.113.21"
      tcp: [47984, 47989, 48010]
      udp: ["47998-48000"]
