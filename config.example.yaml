# Dejarik — what an operator hands the panel. The real one is templated by
# whatever configuration manages it; this is the shape.
listen: ":8080"
# your own word, drawn into the mark. Leave it out and the panel
# ships its own name — it will never wear somebody else's house.
house: "Example House"
base_url: "https://dejarik.example.com"
timezone: "Europe/Paris"
data_dir: /data

auth:
  # identity is the proxy's job, and only from its address (the La Loge
  # contract). Anything else gets nothing.
  trusted_proxies: ["192.0.2.10/32"]
  admin_groups: [admins]
  player_groups: [players]
  # machines: `name:role:token` per line — a Home Assistant button, a script
  tokens_file: /etc/dejarik/tokens

veilleur:
  url: "http://192.0.2.20:8080"
  token_env: DEJARIK_VEILLEUR_TOKEN
  timeout: 5s

projects:
  console:
    label: "the console"
    target: console            # the Le Veilleur target this rides on
    wait_minutes: 10           # its min_uptime — how long it waits for you
    sunshine:
      # the door an unpaired Moonlight reads: no credential, so the second
      # truth survives a wrong or revoked password
      probe_url: "http://203.0.113.21:47989/serverinfo"
      # the web UI's API: pair, list, unpair. Named endpoints only.
      admin_url: "https://203.0.113.21:47990"
      basic_auth_env: DEJARIK_SUNSHINE_BASIC_CONSOLE
      timeout: 3s
    connect:
      host: "203.0.113.21"
      tcp: [47984, 47989, 48010]
      udp: ["47998-48000"]
